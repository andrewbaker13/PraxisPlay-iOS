name: PraxisPlay iOS Cloud Build & TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_testflight:
        description: 'Sign & Upload IPA to Apple TestFlight (requires App Store Connect secrets)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-ios:
    name: Build PraxisPlay iOS (macOS 14 / Xcode)
    runs-on: macos-14
    steps:
      - name: Checkout PraxisPlay-iOS
        uses: actions/checkout@v4

      - name: Generate Xcode Project via XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          xcodegen generate
          # Ensure objectVersion is compatible with Xcode 15.4+ as well as Xcode 16+
          sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' PraxisPlay.xcodeproj/project.pbxproj

      - name: Compile & Verify Universal iPhone + iPad App (Simulator Build)
        run: |
          xcodebuild \
            -project PraxisPlay.xcodeproj \
            -scheme PraxisPlay \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Boot iPhone 15 Pro Simulator & Capture Live Screenshots
        run: |
          mkdir -p build/screenshots
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/PraxisPlay.app"

          # Find an available iPhone 15 Pro or iPhone 15 simulator UDID
          SIM_UDID=$(xcrun simctl list devices available | grep -E "iPhone 15 Pro \(|iPhone 15 \(" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "📱 Booting Simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          # Clean status bar (9:41 AM, full Wi-Fi & battery for App Store quality)
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true

          # Install and launch PraxisPlay
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" com.mktpraxis.praxisplay
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/01-Join-Live-Lobby.png

          # Switch to Solo Practice Arcade Tab
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://tab?index=1"
          sleep 2
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/02-Solo-Practice-Arcade.png

          # Launch Line Fit Interactive Scatter Regression
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://solo?mode=line_fit"
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/03-Line-Fit-Regression.png

          # Launch Budget Blitz Token Optimizer
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://tab?index=1"
          sleep 1
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://solo?mode=budget_blitz"
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/04-Budget-Blitz-Optimizer.png

          # Launch Minority Rule Blue Ocean Strategy
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://tab?index=1"
          sleep 1
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://solo?mode=minority_rule"
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/05-Minority-Rule-Blue-Ocean.png

          # Launch Speed Tap Live Round
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://tab?index=1"
          sleep 1
          xcrun simctl openurl "$SIM_UDID" "mktpraxis://solo?mode=speed_tap"
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/06-Speed-Tap-Live-Round.png

          xcrun simctl shutdown "$SIM_UDID" || true

      - name: Upload Live iPhone 15 Pro Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: PraxisPlay-iPhone-Screenshots
          path: build/screenshots/*.png
          retention-days: 30

      - name: Upload Compiled Simulator .app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PraxisPlay-iOS-Simulator-Build
          path: build/DerivedData/Build/Products/Release-iphonesimulator/PraxisPlay.app
          retention-days: 14

      - name: Archive & Upload Signed IPA to TestFlight (Optional)
        if: ${{ github.event.inputs.deploy_to_testflight == 'true' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          echo "🔐 Configuring signing certificate and provisioning profile for Team S36NQ79D63..."
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/

          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_PRIVATE_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          xcodebuild archive \
            -project PraxisPlay.xcodeproj \
            -scheme PraxisPlay \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PraxisPlay.xcarchive \
            DEVELOPMENT_TEAM=S36NQ79D63

          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>S36NQ79D63</string>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath build/PraxisPlay.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa

          xcrun altool --upload-app \
            --type ios \
            --file build/ipa/PraxisPlay.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
