name: PraxisPlay iOS Cloud Build & TestFlight

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_to_testflight:
        description: 'Sign & Upload IPA to Apple TestFlight (requires App Store Connect secrets)'
        required: false
        default: 'false'
        type: boolean

jobs:
  build-ios:
    name: Build PraxisPlay iOS (Xcode 26 / iOS 26 SDK)
    runs-on: macos-15
    steps:
      - name: Checkout PraxisPlay-iOS
        uses: actions/checkout@v4

      - name: Select Xcode 26 SDK & Generate Xcode Project via XcodeGen
        run: |
          XCODE_26=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_26" ]; then
            echo "🔧 Selecting $XCODE_26"
            sudo xcode-select -s "$XCODE_26/Contents/Developer"
          fi
          xcodebuild -version
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi
          sed -i '' "s/CURRENT_PROJECT_VERSION: \"1\"/CURRENT_PROJECT_VERSION: \"$GITHUB_RUN_NUMBER\"/g" project.yml
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" PraxisPlay/Info.plist
          echo "✅ Stamped CFBundleVersion in Info.plist: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' PraxisPlay/Info.plist)"

      - name: Compile & Verify Universal iPhone + iPad App (Simulator Build)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_testflight == 'false' }}
        run: |
          xcodebuild \
            -project PraxisPlay.xcodeproj \
            -scheme PraxisPlay \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Boot iPhone 15 Pro Simulator & Capture Live Screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_testflight == 'false' }}
        run: |
          mkdir -p build/screenshots
          APP_PATH="build/DerivedData/Build/Products/Release-iphonesimulator/PraxisPlay.app"

          # Find an available iPhone 15 Pro or iPhone 15 simulator UDID
          SIM_UDID=$(xcrun simctl list devices available | grep -E "iPhone 15 Pro \(|iPhone 15 \(" | head -n 1 | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "📱 Booting Simulator UDID: $SIM_UDID"
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          # Clean status bar (9:41 AM, full Wi-Fi & battery for App Store quality)
          xcrun simctl status_bar "$SIM_UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true

          # Install and launch PraxisPlay — Screen 1: Join Live Lobby
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --tab 0
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/01-Join-Live-Lobby.png

          # Screen 2: Solo Practice Arcade Tab
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --tab 1
          sleep 3
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/02-Solo-Practice-Arcade.png

          # Screen 3: Line Fit Interactive Scatter Regression
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo line_fit
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/03-Line-Fit-Regression.png

          # Screen 4: Budget Blitz Token Optimizer
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo budget_blitz
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/04-Budget-Blitz-Optimizer.png

          # Screen 5: Minority Rule Blue Ocean Strategy
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo minority_rule
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/05-Minority-Rule-Blue-Ocean.png

          # Screen 6: Speed Tap Live Round
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo speed_tap
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/06-Speed-Tap-Live-Round.png

          # Screen 7: Buy a Clue (Value of Information)
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo buy_a_clue
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/07-Buy-A-Clue-VoI.png

          # Screen 8: Closest Guess (Confidence Intervals)
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo closest_guess
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/08-Closest-Guess-Interval.png

          # Screen 9: Crowd Wisdom (Social Proof & Distribution)
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo crowd_wisdom
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/09-Crowd-Wisdom-Live.png

          # Screen 10: Push Range (Team Tug-of-War)
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo push_range
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/10-Push-Range-Tug.png

          # Screen 11: Word Guess (Concept Recall)
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo word_guess
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/11-Word-Guess-Recall.png

          # Screen 12: Line Fit Between-Round Regression Summary Visualization
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo line_fit --results
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/12-Line-Fit-Results-Viz.png

          # Screen 13: Closest Guess Between-Round Laser Numberline Visualization
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo closest_guess --results
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/13-Closest-Guess-Results-Viz.png

          # Screen 14: Speed Tap Between-Round Response-Time Dot Plot
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo speed_tap --results
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/14-Speed-Tap-Results-DotPlot.png

          # Screen 15: Minority Rule Between-Round Blue Ocean Market Split Debrief
          xcrun simctl launch --terminate-running-process "$SIM_UDID" com.mktpraxis.praxisplay --solo minority_rule --results
          sleep 4
          xcrun simctl io "$SIM_UDID" screenshot build/screenshots/15-Minority-Rule-Debrief.png

          xcrun simctl shutdown "$SIM_UDID" || true

      - name: Upload Live iPhone 15 Pro Screenshots
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_testflight == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: PraxisPlay-iPhone-Screenshots
          path: build/screenshots/*.png
          retention-days: 30

      - name: Upload Compiled Simulator .app Artifact
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_to_testflight == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: PraxisPlay-iOS-Simulator-Build
          path: build/DerivedData/Build/Products/Release-iphonesimulator/PraxisPlay.app
          retention-days: 14

      - name: Archive & Upload Signed IPA to TestFlight
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_testflight != 'false' }}
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          echo "🔐 Configuring signing certificate and provisioning profile for Team S36NQ79D63..."
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import Apple WWDR G3 intermediate certificate + distribution PKCS#12
          curl -sSL https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer -o "$RUNNER_TEMP/AppleWWDRCAG3.cer"
          security import "$RUNNER_TEMP/AppleWWDRCAG3.cer" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign || true
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Extract UUID and Name from provisioning profile and install to Xcode's Provisioning Profiles folder
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          echo "📄 Installed Provisioning Profile: $PROFILE_NAME ($PROFILE_UUID)"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID.mobileprovision"

          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$ASC_PRIVATE_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          echo "📦 Archiving PraxisPlay (Build #$GITHUB_RUN_NUMBER)..."
          xcodebuild archive \
            -project PraxisPlay.xcodeproj \
            -scheme PraxisPlay \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/PraxisPlay.xcarchive \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=S36NQ79D63 \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            PROVISIONING_PROFILE="$PROFILE_UUID"

          cat <<EOF > build/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>S36NQ79D63</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.mktpraxis.praxisplay</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

          echo "📤 Exporting signed IPA..."
          echo "🔍 Verifying Archive CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :ApplicationProperties:CFBundleVersion' build/PraxisPlay.xcarchive/Info.plist)"
          xcodebuild -exportArchive \
            -archivePath build/PraxisPlay.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/ipa

          echo "🚀 Uploading PraxisPlay.ipa (Build #$GITHUB_RUN_NUMBER) to Apple TestFlight..."
          UPLOAD_LOG="$RUNNER_TEMP/altool_upload.log"
          xcrun altool --upload-app \
            --type ios \
            --file build/ipa/PraxisPlay.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$UPLOAD_LOG"
          if grep -E "Failed to upload package|ERROR:" "$UPLOAD_LOG"; then
            echo "❌ TestFlight upload rejected by App Store Connect!"
            exit 1
          fi
          echo "✅ TestFlight upload of Build #$GITHUB_RUN_NUMBER succeeded!"

      - name: Upload Signed IPA Artifact
        if: ${{ github.event_name == 'push' || github.event.inputs.deploy_to_testflight != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: PraxisPlay-Signed-IPA
          path: build/ipa/*.ipa
          retention-days: 30
